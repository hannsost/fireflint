services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sitegraph
      POSTGRES_PASSWORD: sitegraph
      POSTGRES_DB: sitegraph
    ports:
      - "5432:5432"
    volumes:
      - sitegraph_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitegraph"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sitegraph_pgdata:
