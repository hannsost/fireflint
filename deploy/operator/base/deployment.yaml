apiVersion: apps/v1
kind: Deployment
metadata:
  name: sitegraph-storage-operator
  namespace: sitegraph-system
  labels:
    app.kubernetes.io/name: sitegraph-storage-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sitegraph-storage-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sitegraph-storage-operator
    spec:
      serviceAccountName: sitegraph-storage-operator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/sitegraph/sitegraph-storage-operator:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: sitegraph_operator=info
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
