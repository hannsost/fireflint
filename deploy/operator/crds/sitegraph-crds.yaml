apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sitegraphstorageprofiles.platform.sitegraph.io
spec:
  group: platform.sitegraph.io
  scope: Namespaced
  names:
    kind: SiteGraphStorageProfile
    plural: sitegraphstorageprofiles
    singular: sitegraphstorageprofile
    shortNames: [sgsp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [postgres, volume, resources]
              properties:
                postgres:
                  type: object
                  required: [image, majorVersion]
                  properties:
                    image: {type: string, minLength: 1}
                    majorVersion: {type: integer, minimum: 1}
                    replicas: {type: integer, minimum: 1, default: 1}
                volume:
                  type: object
                  required: [storageClassName, size]
                  properties:
                    storageClassName: {type: string, minLength: 1}
                    size: {type: string, minLength: 1}
                    allowExpansion: {type: boolean, default: false}
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      additionalProperties: {type: string}
                    limits:
                      type: object
                      additionalProperties: {type: string}
                nodeSelector:
                  type: object
                  additionalProperties: {type: string}
                backupProfileRef: {type: string, minLength: 1}
                tlsSecretRef: {type: string, minLength: 1}
                encryptionKeyRef: {type: string, minLength: 1}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, observedGeneration, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sitegraphdatastores.platform.sitegraph.io
spec:
  group: platform.sitegraph.io
  scope: Namespaced
  names:
    kind: SiteGraphDataStore
    plural: sitegraphdatastores
    singular: sitegraphdatastore
    shortNames: [sgds]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [organizationId, domain, dataCategory, topology, region]
              properties:
                organizationId: {type: string, minLength: 1}
                domain: {type: string, minLength: 1}
                dataCategory: {type: string, minLength: 1}
                topology:
                  type: string
                  enum: [shared_row, schema_per_tenant, database_per_tenant, cluster_per_tenant, external]
                region: {type: string, minLength: 1}
                storageProfileRef: {type: string, minLength: 1}
                desiredSchemaVersion: {type: string}
                deletionPolicy:
                  type: string
                  enum: [Retain, SnapshotThenDelete, Delete]
                  default: Retain
                external:
                  type: object
                  required: [endpointRef, credentialSecretRef]
                  properties:
                    endpointRef: {type: string, minLength: 1}
                    credentialSecretRef: {type: string, minLength: 1}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                phase:
                  type: string
                  enum: [Pending, Provisioning, Ready, Migrating, Degraded, Restoring, Deleting]
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, observedGeneration, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                endpointRef: {type: string}
                credentialSecretRef: {type: string}
                currentSchemaVersion: {type: string}
                lastSuccessfulReconciliation: {type: string, format: date-time}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sitegraphstoragebindings.platform.sitegraph.io
spec:
  group: platform.sitegraph.io
  scope: Namespaced
  names:
    kind: SiteGraphStorageBinding
    plural: sitegraphstoragebindings
    singular: sitegraphstoragebinding
    shortNames: [sgsb]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [selector]
              properties:
                selector:
                  type: object
                  properties:
                    organizationId: {type: string, minLength: 1}
                    domain: {type: string, minLength: 1}
                    dataCategory: {type: string, minLength: 1}
                    minimumClassification:
                      type: string
                      enum: [public, internal, confidential, restricted, special_category]
                    region: {type: string, minLength: 1}
                dataStoreRef: {type: string, minLength: 1}
                storageProfileRef: {type: string, minLength: 1}
                priority: {type: integer, format: int32, default: 0}
                fallback: {type: boolean, default: false}
                activeFrom: {type: string, format: date-time}
                activeUntil: {type: string, format: date-time}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, observedGeneration, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                resolvedDataStoreRef: {type: string}
