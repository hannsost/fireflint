[workspace]
resolver = "2"
members = [
    "crates/sitegraph-domain",
    "crates/sitegraph-db",
    "crates/sitegraph-api",
    "crates/sitegraph-bin",
    "crates/foundation/*",
    "crates/platform/*",
    "operator/*",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
utoipa = { version = "5", features = ["uuid", "chrono"] }
kube = { version = "4.0.0", features = ["derive", "runtime"] }
k8s-openapi = "0.28.0"
schemars = "1.1"
serde_yaml = "0.9"
futures = "0.3"

[workspace.lints.clippy]
all = "warn"
